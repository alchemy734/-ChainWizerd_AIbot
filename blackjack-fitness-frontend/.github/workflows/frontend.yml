name: Blackjack Frontend

on:
  push:
    paths:
      - 'blackjack-fitness-frontend/**'
  pull_request:
    paths:
      - 'blackjack-fitness-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackjack-fitness-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blackjack-fitness-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
